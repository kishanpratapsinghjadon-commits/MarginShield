services:
  secureprice-api:
    build: .
    container_name: secureprice-ai
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:///./data/secureprice.db
    volumes:
      # Persist SQLite database outside container lifecycle
      - ./data:/app/data
    restart: unless-stopped+-